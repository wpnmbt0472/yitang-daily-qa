name: build-mac

# 触发方式：
#   1) 仓库页面 → Actions → build-mac → Run workflow（手动，最常用）
#   2) 推一个 v* 标签 → 自动构建并创建 Release，把 dmg 附上去
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    # macos-14 = Apple Silicon(M1)  runner；若需要 Intel 专用包可换成 macos-13
    # 注意：同一台 runner 上可以同时产出 arm64 与 x64 的包（--arm64 --x64）
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 生成图标
        run: npm run icon

      - name: 打包 macOS（arm64 + x64）
        # --publish never 必须加：electron-builder 在 CI 里会触发「隐式发布」，
        # 要求 GH_TOKEN，拿不到就 exit 1（产物其实已经全部打好了）。
        # 我们用自己的 upload-artifact / Release 步骤，不需要它出面。
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          # 没有 Apple 开发者证书时，明确告知 electron-builder 不要去找证书，
          # 否则会因为找不到签名身份而报错中断。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: yitang-daily-mac
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.dmg
            dist/*.zip

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
